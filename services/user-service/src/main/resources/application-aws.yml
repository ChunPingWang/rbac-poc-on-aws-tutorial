# ============================================================
# AWS profile (SPRING_PROFILES_ACTIVE=aws)
#   - Amazon RDS for PostgreSQL（schema-per-service: user_service；"user" 是 PostgreSQL 保留字，不能當 schema 名）
#   - Amazon Cognito 作為 OAuth2 / OIDC Issuer
#   - 帳密由 ECS 從 Secrets Manager（RDS managed secret）注入環境變數
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:rbacpoc}?currentSchema=user_service&sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: user_service
    show-sql: false
  flyway:
    enabled: true
    schemas: user_service
    default-schema: user_service
    create-schemas: true
    baseline-on-migrate: true
  h2:
    console:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # https://cognito-idp.<region>.amazonaws.com/<userPoolId>
          issuer-uri: ${COGNITO_ISSUER_URI}

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.ecommerce: INFO
    com.example.audit: INFO
    org.springframework.security: INFO
