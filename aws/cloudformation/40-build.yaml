AWSTemplateFormatVersion: '2010-09-09'
Description: >
  rbac-poc-on-aws / 40 - Build. Amazon ECR repositories (immutable tags, scan on push)
  + AWS CodeBuild project (unit tests -> bootJar -> docker build -> push).

Parameters:
  ProjectName: { Type: String, Default: rbac-poc }
  SourceKey: { Type: String, Default: source/rbac-poc-source.zip }

Resources:
  ProductRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}/product-service'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep last 10 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}
      Tags: [{ Key: Project, Value: !Ref ProjectName }]
  UserRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}/user-service'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep last 10 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${ProjectName}-build'
      RetentionInDays: 14

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-codebuild-role'
      PermissionsBoundary: !ImportValue { 'Fn::Sub': '${ProjectName}-workload-boundary-arn' }
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } }
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogGroup.Arn
              - Sid: ReadSource
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:GetBucketLocation, s3:ListBucket]
                Resource:
                  - !Sub
                    - 'arn:${AWS::Partition}:s3:::${Bucket}'
                    - Bucket: !ImportValue { 'Fn::Sub': '${ProjectName}-artifact-bucket' }
                  - !Sub
                    - 'arn:${AWS::Partition}:s3:::${Bucket}/*'
                    - Bucket: !ImportValue { 'Fn::Sub': '${ProjectName}-artifact-bucket' }
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: [!GetAtt ProductRepo.Arn, !GetAtt UserRepo.Arn]
              - Sid: TestReports
                Effect: Allow
                Action: [codebuild:CreateReportGroup, codebuild:CreateReport, codebuild:UpdateReport, codebuild:BatchPutTestCases]
                Resource: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/${ProjectName}-build-*'

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-build'
      Description: Test, package and containerise product-service & user-service
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 30
      Source:
        Type: S3
        Location: !Sub
          - '${Bucket}/${SourceKey}'
          - Bucket: !ImportValue { 'Fn::Sub': '${ProjectName}-artifact-bucket' }
        BuildSpec: aws/codebuild/buildspec.yml
      Artifacts: { Type: NO_ARTIFACTS }
      Cache:
        Type: LOCAL
        Modes: [LOCAL_DOCKER_LAYER_CACHE, LOCAL_CUSTOM_CACHE]
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: true          # required for docker build
        EnvironmentVariables:
          - { Name: ECR_REGISTRY, Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com' }
          - { Name: PRODUCT_REPO_URI, Value: !GetAtt ProductRepo.RepositoryUri }
          - { Name: USER_REPO_URI, Value: !GetAtt UserRepo.RepositoryUri }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Ref BuildLogGroup }
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

Outputs:
  BuildProjectName: { Value: !Ref BuildProject, Export: { Name: !Sub '${ProjectName}-build-project' } }
  ProductRepoUri: { Value: !GetAtt ProductRepo.RepositoryUri, Export: { Name: !Sub '${ProjectName}-product-repo-uri' } }
  UserRepoUri: { Value: !GetAtt UserRepo.RepositoryUri, Export: { Name: !Sub '${ProjectName}-user-repo-uri' } }
