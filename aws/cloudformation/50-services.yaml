AWSTemplateFormatVersion: '2010-09-09'
Description: >
  rbac-poc-on-aws / 50 - Services. ECS Fargate (replaces Kind/K8s Deployments) behind an
  INTERNAL Application Load Balancer (replaces NodePort / K8s Service). Path-based routing
  replaces Spring Cloud Gateway routes. Tasks run in private subnets, non-root,
  read-only root filesystem, DB credentials injected from Secrets Manager.

Parameters:
  ProjectName: { Type: String, Default: rbac-poc }
  ImageTag: { Type: String, Description: Immutable image tag produced by CodeBuild }
  DesiredCount: { Type: Number, Default: 1, MinValue: 0, MaxValue: 4 }

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-cluster'
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  # Execution role: used by the ECS agent (pull image, write logs, fetch secrets)
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecs-execution-role'
      PermissionsBoundary: !ImportValue { 'Fn::Sub': '${ProjectName}-workload-boundary-arn' }
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } }
      Policies:
        - PolicyName: pull-log-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}/*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${ProjectName}/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !ImportValue { 'Fn::Sub': '${ProjectName}-db-secret-arn' }

  # Task role: what the application code itself may call. The apps call no AWS APIs -> empty.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecs-task-role'
      PermissionsBoundary: !ImportValue { 'Fn::Sub': '${ProjectName}-workload-boundary-arn' }
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } }

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-internal-alb'
      Scheme: internal
      Type: application
      Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${ProjectName}-app-subnets' }]
      SecurityGroups: [!ImportValue { 'Fn::Sub': '${ProjectName}-alb-sg' }]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: routing.http.desync_mitigation_mode, Value: strictest }
        - { Key: idle_timeout.timeout_seconds, Value: '30' }
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: application/json
            MessageBody: '{"success":false,"errorCode":"NO_ROUTE"}'

  # ======================= product-service =======================
  ProductLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/${ProjectName}/product-service'
      RetentionInDays: 14

  ProductTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-product-service'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes: [{ Name: tmp }]
      ContainerDefinitions:
        # Fargate creates the ephemeral 'tmp' volume as root:root 0755, so the non-root app
        # (UID 65532) could not write Tomcat's work dir. This init container runs once as root,
        # opens /tmp (1777) and exits; the app container starts only after it succeeds.
        - Name: init-tmp
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo: !ImportValue { 'Fn::Sub': '${ProjectName}-product-repo-uri' }
          Essential: false
          User: '0'
          ReadonlyRootFilesystem: true
          EntryPoint: [sh, -c]
          Command: ['chmod 1777 /tmp && echo tmp-ready']
          MountPoints: [{ SourceVolume: tmp, ContainerPath: /tmp }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ProductLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: init
        - Name: product-service
          DependsOn: [{ ContainerName: init-tmp, Condition: SUCCESS }]
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo: !ImportValue { 'Fn::Sub': '${ProjectName}-product-repo-uri' }
          Essential: true
          ReadonlyRootFilesystem: true
          User: '65532:65532'
          PortMappings: [{ ContainerPort: 8081, Protocol: tcp }]
          MountPoints: [{ SourceVolume: tmp, ContainerPath: /tmp }]
          Environment:
            - { Name: SPRING_PROFILES_ACTIVE, Value: aws }
            - { Name: SERVER_PORT, Value: '8081' }
            - { Name: DB_HOST, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-db-endpoint' } }
            - { Name: DB_PORT, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-db-port' } }
            - { Name: DB_NAME, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-db-name' } }
            - { Name: COGNITO_ISSUER_URI, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-issuer-uri' } }
            - { Name: AUDIT_SERVICE_NAME, Value: product-service }
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub
                - '${Secret}:username::'
                - Secret: !ImportValue { 'Fn::Sub': '${ProjectName}-db-secret-arn' }
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${Secret}:password::'
                - Secret: !ImportValue { 'Fn::Sub': '${ProjectName}-db-secret-arn' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ProductLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  ProductTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-product-tg'
      VpcId: !ImportValue { 'Fn::Sub': '${ProjectName}-vpc-id' }
      TargetType: ip
      Protocol: HTTP
      Port: 8081
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
  ProductRule10:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions: [{ Field: path-pattern, PathPatternConfig: { Values: ['/api/products', '/api/products/*'] } }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref ProductTg }]
  ProductRule20:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 20
      Conditions: [{ Field: path-pattern, PathPatternConfig: { Values: ['/api/v1/audit-logs', '/api/v1/audit-logs/*'] } }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref ProductTg }]

  ProductService:
    Type: AWS::ECS::Service
    DependsOn: [ProductRule10]
    Properties:
      ServiceName: !Sub '${ProjectName}-product-service'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ProductTaskDef
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 240
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${ProjectName}-app-subnets' }]
          SecurityGroups: [!ImportValue { 'Fn::Sub': '${ProjectName}-app-sg' }]
      LoadBalancers:
        - { ContainerName: product-service, ContainerPort: 8081, TargetGroupArn: !Ref ProductTg }
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  # ======================= user-service =======================
  UserLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/${ProjectName}/user-service'
      RetentionInDays: 14

  UserTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-user-service'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes: [{ Name: tmp }]
      ContainerDefinitions:
        # Fargate creates the ephemeral 'tmp' volume as root:root 0755, so the non-root app
        # (UID 65532) could not write Tomcat's work dir. This init container runs once as root,
        # opens /tmp (1777) and exits; the app container starts only after it succeeds.
        - Name: init-tmp
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo: !ImportValue { 'Fn::Sub': '${ProjectName}-user-repo-uri' }
          Essential: false
          User: '0'
          ReadonlyRootFilesystem: true
          EntryPoint: [sh, -c]
          Command: ['chmod 1777 /tmp && echo tmp-ready']
          MountPoints: [{ SourceVolume: tmp, ContainerPath: /tmp }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref UserLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: init
        - Name: user-service
          DependsOn: [{ ContainerName: init-tmp, Condition: SUCCESS }]
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo: !ImportValue { 'Fn::Sub': '${ProjectName}-user-repo-uri' }
          Essential: true
          ReadonlyRootFilesystem: true
          User: '65532:65532'
          PortMappings: [{ ContainerPort: 8082, Protocol: tcp }]
          MountPoints: [{ SourceVolume: tmp, ContainerPath: /tmp }]
          Environment:
            - { Name: SPRING_PROFILES_ACTIVE, Value: aws }
            - { Name: SERVER_PORT, Value: '8082' }
            - { Name: DB_HOST, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-db-endpoint' } }
            - { Name: DB_PORT, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-db-port' } }
            - { Name: DB_NAME, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-db-name' } }
            - { Name: COGNITO_ISSUER_URI, Value: !ImportValue { 'Fn::Sub': '${ProjectName}-issuer-uri' } }
            - { Name: AUDIT_SERVICE_NAME, Value: user-service }
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub
                - '${Secret}:username::'
                - Secret: !ImportValue { 'Fn::Sub': '${ProjectName}-db-secret-arn' }
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${Secret}:password::'
                - Secret: !ImportValue { 'Fn::Sub': '${ProjectName}-db-secret-arn' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref UserLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  UserTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-user-tg'
      VpcId: !ImportValue { 'Fn::Sub': '${ProjectName}-vpc-id' }
      TargetType: ip
      Protocol: HTTP
      Port: 8082
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
  UserRule10:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 30
      Conditions: [{ Field: path-pattern, PathPatternConfig: { Values: ['/api/users', '/api/users/*'] } }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref UserTg }]

  UserService:
    Type: AWS::ECS::Service
    DependsOn: [UserRule10]
    Properties:
      ServiceName: !Sub '${ProjectName}-user-service'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref UserTaskDef
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 240
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${ProjectName}-app-subnets' }]
          SecurityGroups: [!ImportValue { 'Fn::Sub': '${ProjectName}-app-sg' }]
      LoadBalancers:
        - { ContainerName: user-service, ContainerPort: 8082, TargetGroupArn: !Ref UserTg }
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

Outputs:
  ClusterName: { Value: !Ref Cluster, Export: { Name: !Sub '${ProjectName}-cluster-name' } }
  ListenerArn: { Value: !Ref Listener, Export: { Name: !Sub '${ProjectName}-alb-listener-arn' } }
  AlbDnsName: { Value: !GetAtt Alb.DNSName }
  ImageTag: { Value: !Ref ImageTag }
